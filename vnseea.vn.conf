server {
    server_name vnseea.vn
        www.vnseea.vn
        mail.vnseea.vn
        webmail.vnseea.vn
        admin.vnseea.vn;
    client_max_body_size 512M;
    charset utf-8;
	listen 443 ssl;
	listen [::]:443 ssl;
	root /home/vnseea/main/social;
    index index.php index.html index.htm;

    access_log /var/log/virtualmin/vnseea.vn_access_log;
    error_log /var/log/virtualmin/vnseea.vn_error_log;

    ssl_certificate /etc/letsencrypt/live/vnseea.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vnseea.vn/privkey.pem;

    location ^~ /.well-known/ {
        try_files $uri /;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

   location ^~ /realtime/ {
    	proxy_pass http://127.0.0.1:3025/;
    	proxy_http_version 1.1;

    	proxy_set_header Host $host;
   		proxy_set_header X-Real-IP $remote_addr;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;

    	proxy_set_header Upgrade $http_upgrade;
    	proxy_set_header Connection "upgrade";
    	proxy_buffering off;
	}
	location /mobile-socket/socket.io/ {
    proxy_pass http://127.0.0.1:3026/socket.io/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
}
	location /socket.io/ {
    proxy_pass http://127.0.0.1:3025/socket.io/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
}

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /cache {
        deny all;
        return 404;
    }

    location /sources {
        deny all;
        return 404;
    }

    location /nodejs {
        deny all;
        return 404;
    }

    location /adminPages/ {
        alias /home/vnseea/main/admin-panel/;
    }

    location ^~ /upload/ {
    try_files $uri =404;

    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
}

    location ^~ /themes/ {
    try_files $uri =404;

    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
	}

    location ^~ /assets/ {
    try_files $uri =404;

    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

    location ^~ /_nuxt/ {
        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location ^~ /__vite_ping {
        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location ^~ /@vite/ {
        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location ^~ /@id/ {
        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
    }

    location ^~ /@fs/ {
        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_api/ {
        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location ^~ /api/_nuxt_icon/ {
        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location = /admincp {
        rewrite ^ /admincp.php last;
    }

    location /admincp {
        rewrite ^/admincp/(.*)$ /admincp.php?page=$1 last;
    }

    location /admin {
        rewrite ^/admin-cp$ /admincp.php last;
        rewrite ^/admin-cp/(.*)$ /admincp.php?page=$1 last;
        rewrite ^/admin/ads/edit/(\d+)(/?|)$ /index.php?link1=manage-ads&id=$1 last;
    }

    location /api {
        rewrite ^/api(/?|)$ /api-v2.php last;
        rewrite ^/api/([^\/]+)(\/|)$ /api-v2.php?type=$1 last;
    }

    location ~ ^/(ajax_loading|requests|login-with|call|call_livekit|call_group_livekit|call_jitsi|cron-job|OneSignalSDKWorker|api-v2|api|app_api|admin_load|system_status|updater)\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/177434245169607.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/177434245169607.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location / {
        proxy_pass http://127.0.0.1:3001$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    if ($host = webmail.vnseea.vn) {
        rewrite "^/(.*)$" "https://vnseea.vn:20000/$1" redirect;
    }

    if ($host = admin.vnseea.vn) {
        rewrite "^/(.*)$" "https://vnseea.vn:10001/$1" redirect;
    }

    rewrite /awstats/awstats.pl /cgi-bin/awstats.pl;
    rewrite /awstats/awstats.pl /cgi-bin/awstats.pl;
}

server {
    if ($host = vnseea.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name vnseea.vn
        www.vnseea.vn
        mail.vnseea.vn
        webmail.vnseea.vn
        admin.vnseea.vn
        127.0.0.1
        localhost;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot

}
