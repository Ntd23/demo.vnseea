# English description: Deploys the PHP backend and Nuxt frontend to the production server.
name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-v2:
    runs-on: ubuntu-latest
    env:
      DEPLOY_STAGE: v2
      RELEASE_SHA: ${{ github.sha }}
      V2_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      PRIMARY_DEPLOY_PATH: ${{ secrets.PRIMARY_DEPLOY_PATH }}
      PNPM_BIN: /root/.local/share/pnpm/bin/pnpm

    steps:
      - name: Deploy and validate v2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_STAGE,RELEASE_SHA,V2_DEPLOY_PATH,PRIMARY_DEPLOY_PATH,PNPM_BIN
          script_stop: true
          script: |
            set -Eeuo pipefail

            export PATH="/root/.local/share/pnpm/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            : "${V2_DEPLOY_PATH:?V2_DEPLOY_PATH is required}"
            : "${RELEASE_SHA:?RELEASE_SHA is required}"
            PRIMARY_DEPLOY_PATH="${PRIMARY_DEPLOY_PATH:-/home/vnseea/main}"
            export PRIMARY_DEPLOY_PATH

            cd "$V2_DEPLOY_PATH"
            PREVIOUS_V2_SHA="$(git rev-parse HEAD)"
            export PREVIOUS_V2_SHA
            printf '%s\n' "$PREVIOUS_V2_SHA" > /home/vnseea/last_deploy_commit.txt

            V2_NODE_CONFIG_BACKUP="$(mktemp /tmp/vnseea-node-config.XXXXXX)"
            cp -p nodejs/config.json "$V2_NODE_CONFIG_BACKUP"
            restore_v2_node_config() {
              cp -p "$V2_NODE_CONFIG_BACKUP" "$V2_DEPLOY_PATH/nodejs/config.json" || true
              rm -f -- "$V2_NODE_CONFIG_BACKUP"
            }
            trap restore_v2_node_config EXIT

            git fetch origin main
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
            git reset --hard "$RELEASE_SHA"
            cp -p "$V2_NODE_CONFIG_BACKUP" nodejs/config.json
            git clean -fd -- client/app client/server client/src client/realtime client/scripts

            bash scripts/deploy-production.sh

  deploy-primary:
    needs: deploy-v2
    runs-on: ubuntu-latest
    env:
      DEPLOY_STAGE: primary
      RELEASE_SHA: ${{ github.sha }}
      V2_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      PRIMARY_DEPLOY_PATH: ${{ secrets.PRIMARY_DEPLOY_PATH }}
      PNPM_BIN: /root/.local/share/pnpm/bin/pnpm

    steps:
      - name: Promote validated release to vnseea.vn
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_STAGE,RELEASE_SHA,V2_DEPLOY_PATH,PRIMARY_DEPLOY_PATH,PNPM_BIN
          script_stop: true
          script: |
            set -Eeuo pipefail

            export PATH="/root/.local/share/pnpm/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            : "${V2_DEPLOY_PATH:?V2_DEPLOY_PATH is required}"
            : "${RELEASE_SHA:?RELEASE_SHA is required}"
            PRIMARY_DEPLOY_PATH="${PRIMARY_DEPLOY_PATH:-/home/vnseea/main}"
            export PRIMARY_DEPLOY_PATH

            cd "$V2_DEPLOY_PATH"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            bash scripts/deploy-production.sh
